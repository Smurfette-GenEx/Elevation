name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: expense, POSTGRES_PASSWORD: expense, POSTGRES_DB: expense }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U expense" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://expense:expense@localhost:5432/expense?schema=public
      TEST_DATABASE_URL: postgresql://expense:expense@localhost:5432/expense_test?schema=public
      APP_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-1234
      APP_URL: http://localhost:3100
      CRON_SECRET: ci-cron-secret-123456
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Create test database
        run: PGPASSWORD=expense psql -h localhost -U expense -c "CREATE DATABASE expense_test"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npx prisma migrate deploy
      - run: npm run db:seed
        env: { NODE_OPTIONS: "" }
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { E2E_PORT: "3100" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results, retention-days: 7 }

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., push: false, tags: "group-expense-platform:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
