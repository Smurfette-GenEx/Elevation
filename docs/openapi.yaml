          "comment": {
            "type": "string",
            "description": "Required for REJECT and REQUEST_INFO"
          }
        },
        "required": [
          "decision"
        ]
      },
      "Reassign": {
        "type": "object",
        "properties": {
          "toUserId": {
            "type": "string"
          },
          "reason": {
            "type": "string",
            "minLength": 5
          }
        },
        "required": [
          "toUserId",
