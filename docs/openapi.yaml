                "pattern": "^\\d{1,13}(\\.\\d{1,4})?$",
                "example": "125.50"
              },
              "vehicleType": {
                "type": "string"
              },
              "fromLocation": {
                "type": "string"
              },
              "toLocation": {
                "type": "string"
              }
            },
            "required": []
          }
        },
        "required": [
          "expenseDate",
          "categoryId",
          "merchant",
          "description",
          "countryCode",
          "currency",
          "costCenterId",
          "paymentMethod"
        ]
      },
      "FxOverride": {
        "type": "object",
