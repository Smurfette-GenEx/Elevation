            "type": "string"
          },
          "purpose": {
            "type": "string"
          },
          "version": {
            "type": "integer"
          }
        },
        "required": [
          "version"
        ]
      },
      "ExpenseLine": {
        "type": "object",
        "properties": {
          "expenseDate": {
            "type": "string",
            "format": "date"
          },
          "categoryId": {
            "type": "string"
          },
          "merchant": {
            "type": "string"
          },
          "description": {
            "type": "string"
          },
          "countryCode": {
            "type": "string",
            "pattern": "^[A-Z]{2}$"
          },
          "currency": {
            "type": "string",
            "pattern": "^[A-Z]{3}$"
          },
          "grossAmount": {
            "type": "string",
            "pattern": "^\\d{1,13}(\\.\\d{1,4})?$",
            "example": "125.50"
          },
          "taxAmount": {
            "type": "string",
            "pattern": "^\\d{1,13}(\\.\\d{1,4})?$",
            "example": "125.50"
          },
          "taxRate": {
            "type": "number"
          },
          "costCenterId": {
            "type": "string"
          },
          "projectId": {
            "type": "string"
          },
          "budgetCode": {
            "type": "string"
          },
          "paymentMethod": {
            "type": "string",
            "enum": [
              "PERSONAL_CARD",
              "CORPORATE_CARD",
              "CASH",
              "BANK_TRANSFER",
              "COMPANY_PAID"
            ]
          },
          "attendees": {
            "type": "string"
          },
          "nights": {
            "type": "integer"
          },
          "receiptId": {
            "type": "string"
          },
          "receiptMissingReason": {
            "type": "string"
          },
