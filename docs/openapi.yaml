            "type": "string",
            "minLength": 5
          }
        },
        "required": [
          "approve",
          "note"
        ]
      },
      "Delegation": {
        "type": "object",
        "properties": {
          "toUserId": {
            "type": "string"
          },
          "startsAt": {
            "type": "string",
            "format": "date"
          },
          "endsAt": {
            "type": "string",
            "format": "date"
          },
          "reason": {
            "type": "string"
          }
        },
        "required": [
