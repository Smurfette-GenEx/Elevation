# OpenAPI 3.1 — JSON syntax is valid YAML
{
  "openapi": "3.1.0",
  "info": {
    "title": "Group Expense Platform API",
    "version": "1.0.0",
    "description": "REST API of the international expense management platform. Authentication uses an HttpOnly session cookie obtained from /auth/login. Every mutating call must come from the application origin (Origin/Referer check). Authorization is role \u00d7 organisational scope, enforced server-side; out-of-scope records return 404. Monetary amounts are decimal strings."
  },
  "servers": [
    {
      "url": "/api/v1"
    }
  ],
  "security": [
    {
      "session": []
    }
  ],
  "components": {
    "securitySchemes": {
      "session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "xp_session"
      },
      "cronBearer": {
        "type": "http",
        "scheme": "bearer"
      }
    },
    "schemas": {
      "Error": {
        "type": "object",
        "properties": {
          "error": {
            "type": "object",
            "properties": {
              "code": {
                "type": "string",
                "enum": [
                  "UNAUTHENTICATED",
                  "FORBIDDEN",
                  "NOT_FOUND",
                  "VALIDATION",
                  "CONFLICT",
                  "BUSINESS_RULE",
                  "RATE_LIMITED",
                  "PAYLOAD_TOO_LARGE",
                  "INTERNAL"
                ]
              },
              "message": {
                "type": "string"
              },
              "details": {}
            },
            "required": [
              "code",
              "message"
            ]
          }
        },
        "required": [
          "error"
        ]
      },
      "Login": {
        "type": "object",
        "properties": {
          "email": {
            "type": "string",
            "format": "email"
          },
          "password": {
            "type": "string"
          }
        },
        "required": [
          "email",
          "password"
        ]
      },
      "CreateReport": {
        "type": "object",
        "properties": {
          "title": {
            "type": "string",
